<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>★琉光販賣所-會員儲值★</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&;family=Noto+Sans+TC:wght@400;600&;display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f6f1eb;
  --card: #fffaf4;
  --primary: #b48a63;
  --primary-dark: #9c7350;
  --text: #4a3b2c;
  --hint: #9a8f84;
}

.c-label {
  display: inline-block;
  width: 100px;
  text-align: right;
}


* {
  box-sizing: border-box;
  font-family: "Noto Sans TC","Microsoft JhengHei",sans-serif;
}

body {
  background: linear-gradient(180deg,#f6f1eb,#ede3d7);
  padding: 40px 16px;
  color: var(--text);
}

.container {
  max-width: 420px;
  margin: auto;
  background: var(--card);
  padding: 28px;
  border-radius: 22px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.08);
}

/* 標題 */
h2 {
  text-align: center;
  margin-bottom: 24px;
  font-size: 22px;
  line-height: 1.4;
}
.subtitle {
  display:block;
  font-size:14px;
  color:#9a8f84;
  margin-top:4px;
  letter-spacing:2px;
}

/* 表單 */
.field {
  margin-bottom: 14px;
}

label {
  display:block;
  font-size:14px;
}

input, select {
  width:100%;
  margin-top:6px;
  font-size:15px;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
}

.hint {
  margin-top:6px;
  font-size:12px;
  color: var(--hint);
}

/* 按鈕 */
button {
  width:100%;
  margin-top: 26px;
  padding: 14px;
  background: linear-gradient(135deg,#b48a63,#caa684);
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
  color:white;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(180,138,99,0.35);
  transition: all 0.2s ease;
}
button:hover {
  transform: translateY(-2px);
  box-shadow:0 12px 22px rgba(180,138,99,0.45);
}

/* 匯款區 */
.bank-info {
  margin-top: 24px;
  margin-bottom: 20px;
  padding: 16px;
  border-radius: 14px;
  background: linear-gradient(135deg,#f7efe8,#fdf8f2);
  border: 1px dashed #d8c9b8;
}
.bank-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #6b5a4a;
}
.bank-row {
  font-size: 14px;
  margin-bottom: 4px;
}
.bank-note {
  margin-top: 6px;
  font-size: 12px;
  color: var(--hint);
}

/* modal */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box {
  background:white;
  padding:24px;
  border-radius:16px;
  max-width:340px;
  width:90%;
  text-align:center;
}

/* loading */

.loading {
  position: fixed;
  inset: 0;

  /* ✅ 從 0.75 → 0.4（變淡） */
  background: rgba(246,241,235,0.4);

  display: none;

  flex-direction: column;
  align-items: center;
  justify-content: center;

  backdrop-filter: blur(4px);   /* ✅ 加毛玻璃（質感提升🔥） */
}

.spinner {
  width: 60px;              /* ✅ 變大（原46） */
  height: 60px;

  border: 5px solid rgba(180,138,99,0.2);  /* ✅ 淡底 */
  border-top: 5px solid #b48a63;            /* ✅ 主色 */

  border-radius: 50%;
  animation: spin 0.9s linear infinite;   /* ✅ 稍微快一點 */
}
@keyframes spin { to { transform: rotate(360deg); } }
  
@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
  
.loading-text {
  margin-top: 16px;

  font-family: "Playfair Display", "Noto Sans TC", serif;  /* ✅ 混搭 */
  font-size: 18px;
  font-weight: 500;

  letter-spacing: 4px;
  color: #b48a63;

  text-transform: lowercase;  /* ✅ kirariri 比較好看 */

  text-shadow: 0 0 8px rgba(180,138,99,0.4);

  animation: fadeBlink 1.5s ease-in-out infinite;
  text-align: center;
}



/* 呼吸閃爍效果 */
@keyframes fadeBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.sparkle {
  display: inline-block;
  animation: sparkleGlow 1.8s infinite;
}

/* 讓左右不完全同步（更自然） */
.sparkle:nth-child(1) {
  animation-delay: 0s;
}
.sparkle:nth-child(2) {
  animation-delay: 0.9s;
}

@keyframes sparkleGlow {
  0%, 100% {
    opacity: 0.4;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.3);
    color: #d4a373;
    text-shadow: 0 0 6px rgba(180,138,99,0.5);
  }
}

/* 加購區 */
.addon-group {
  margin-top: 28px;   /* ✅ 和上面拉開 */
  margin-bottom: 24px; /* ✅ 和下面拉開 */
}

/* 每一行 */
.addon-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;   /* ✅ 行距變大 */
  cursor: pointer;
}

/* 隱藏原本 checkbox */
.addon-line input {
  display: none;
}

/* checkbox */
.checkmark {
  width: 16px;
  height: 16px;
  border: 2px solid #b48a63;
  border-radius: 4px;
  position: relative;
}

/* 勾選 */
.addon-line input:checked + .checkmark {
  background: #b48a63;
}

.addon-line input:checked + .checkmark::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 0px;
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* 文字 */

.addon-text {
  display: flex;
  flex-direction: column;
}
  
.addon-title {
  line-height: 1.4;
}
  
.addon-note {
  line-height: 1.4;
}

.field {
  margin-bottom: 20px;  /* ✅ 原本14 → 放大 */
}

.addon-line:hover {
  opacity: 0.75;
}

.slot-display {
  margin-top: 14px;
  font-size: 30px;
  font-weight: bold;
  color: #9c7350;
}

.total-section {
  margin-top: 24px;
  text-align: center;
  padding: 16px;
  border-radius: 14px;
  background: #f9f4ee;   /* ✅ 淺色區塊 */
  border: 1px solid #eee;
}

.total-title {
  font-size: 16px;
  font-weight: 600;  /* ✅ 稍微加粗 */
  color: #9a8f84;
  margin-bottom: 6px;
}

.subtitle-note {
  display: block;
  font-size: 12px;
  color: #9a8f84;
  margin-top: 6px;
  letter-spacing: 1px;
}

  
.banner {
  margin-bottom: 20px;
  text-align: center;
}

.banner img {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.banner2 {
  text-align: center;
}

.banner2 img {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
  
</style>
</head>

<body>

<div class="container">
  
  <h2>
    <span class="sparkle">✧</span>
    琉光少女造型室
    <span class="sparkle">✧</span>
  
    <span class="subtitle">會員儲值</span>
  
    <span class="subtitle-note">
      *如有任何問題請私訊客服*
    </span>
  </h2>
  
  <!-- ✅ ✅ ✅ 圖片放這裡 -->  
  <div class="banner">
    <img src="membership.jpg">
  </div>


  <div class="field">
    <label>👤 姓名</label>
    <input id="name" placeholder="請輸入姓名">
    <div class="hint">請填寫全名以利核對</div>
  </div>

  <div class="field">
    <label>📞 電話</label>
    <input id="phone" placeholder="0912345678" maxlength="10">
    <div class="hint">請輸入 10 碼手機號碼</div>
  </div>

  <div class="field">
    <label>👑 會員</label>
    <select id="membership">
      <option value="" disabled selected>請選擇會員</option>
      <option value="公主會員">琉光冠冕卡 - 公主會員</option>
      <option value="華族會員">琉光華羽卡 - 華族會員</option>
      <option value="少女會員">琉光初綻卡 - 少女會員</option>
    </select>
    <div class="hint">若不需要請選無</div>
  </div>

  <div class="field">
    <label>💰 匯款後5碼</label>
    <input id="paycode" placeholder="12345" maxlength="5">
    <div class="hint">請填寫轉帳完成後的帳號末 5 碼</div>
  </div>
  
  <div class="total-section">
    <div class="total-title">儲值金額</div>
    <div class="slot-display" id="slotDisplay">--</div>
  </div>

  <div class="bank-info">
    <div class="bank-title">匯款資訊</div>
    <div class="bank-row">銀行：永豐銀行（807）</div>
    <div class="bank-row">帳號：11601801829638</div>
    <div class="bank-note">※ 完成匯款後，請填寫上方匯款後5碼</div>
    <div class="bank-note">匯款完成私訊 kirariri studio 確認才算完成預約唷～*</div>
    <div class="bank-note">IG：kirariri_studio</div>
  </div>

  <button onclick="prepareConfirm()">儲值</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>


<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">kirariri studio</div>
</div>

<script>
  const BACKEND = "https://hairbooking-backend.onrender.com";

  const modal = document.getElementById("modal");
  const modalBox = document.getElementById("modalBox");
  const loading = document.getElementById("loading");

  const nameEl = document.getElementById("name");
  const phoneEl = document.getElementById("phone");
  const paycodeEl = document.getElementById("paycode");
  const membershipEl = document.getElementById("membership");

  [
      nameEl,
      phoneEl,
      paycodeEl,
      membershipEl
  ].forEach(el => {

      el.addEventListener("input", () => {
          el.style.border = "1px solid #ddd";
      });

      el.addEventListener("change", () => {
          el.style.border = "1px solid #ddd";
      });

  });

  function showLoading(){
      loading.style.display = "flex";
  }

  function hideLoading(){
      loading.style.display = "none";
  }

  function showModal(html){
      modalBox.innerHTML = html;
      modal.style.display = "flex";
  }

  function closeModal(){
      modal.style.display = "none";
  }

  function prepareConfirm(){
      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();
      const pay = paycodeEl.value.trim();
      const membership = membershipEl.value;

      let hasError = false;

      // 標紅
      markError(nameEl, !name);
      markError(phoneEl, !phone);
      markError(paycodeEl, !pay);
      markError(membershipEl, !membership);

      if(!name || !phone || !pay || !membership){
          hasError = true;
      }

      // 電話格式
      if(phone && !/^\d{10}$/.test(phone)){
          markError(phoneEl, true);

          showModal(`
              <p>電話需為10位數字</p>
              <button onclick="closeModal()">確定</button>
          `);

          return;
      }

      // 匯款後5碼
      if(pay && !/^\d{5}$/.test(pay)){
          markError(paycodeEl, true);

          showModal(`
              <p>匯款後5碼需為5位數</p>
              <button onclick="closeModal()">確定</button>
          `);

          return;
      }
      
      let total = 0;

      if (membership === "少女會員") {
          total = 3000;
      }

      if (membership === "華族會員") {
          total = 5000;
      }

      if (membership === "公主會員") {
          total = 8000;
      }

      if(hasError){

          const firstError = document.querySelector(
              'input[style*="e74c3c"], select[style*="e74c3c"]'
          );

          if(firstError){
              firstError.scrollIntoView({
                  behavior:"smooth",
                  block:"center"
              });
          }

          showModal(`
              <p>請將標示欄位填寫完整</p>
              <button onclick="closeModal()">確定</button>
          `);

          return;
      }

      // 下面才顯示確認畫面
      showModal(`
        <p style="font-weight:bold">請確認會員資料</p>

        <div style="text-align:left; display:inline-block;">

          <p>
            <span class="c-label">姓名</span>
            ：${name}
          </p>

          <p>
            <span class="c-label">電話</span>
            ：${phone}
          </p>

          <p>
            <span class="c-label">會員方案</span>
            ：${membership}
          </p>

          <p>
            <span class="c-label">匯款後5碼</span>
            ：${pay}
          </p>

          <p style="margin-top:8px;font-weight:bold;">
            <span class="c-label">儲值金額</span>
            ：$${total.toLocaleString()}
          </p>

        </div>

        <button onclick="submitMembership()">
          確認送出
        </button>

        <button onclick="closeModal()">
          取消
        </button>
      `);
      
  }

  function submitMembership(){
      showLoading();

      let amount = 0;

      if (membershipEl.value === "少女會員"){
          amount = 3000;
      }

      if (membershipEl.value === "華族會員"){
          amount = 5000;
      }

      if (membershipEl.value === "公主會員"){
          amount = 8000;
      }

      fetch(`${BACKEND}/membership-reload`,{
          method:"POST",
          headers:{
              "Content-Type":"application/json"
          },
          body:JSON.stringify({
              name: nameEl.value.trim(),
              phone: phoneEl.value.trim(),
              membership: membershipEl.value,
              amount: amount
          })
      })
      .then(async r => {

          const data = await r.json();

          if(!r.ok){
              throw new Error(data.detail || "儲值失敗");
          }

          return data;
      })
      .then(() => {

          showModal(`
              <p style="font-size:18px;">
                  ✅ 會員儲值成功
              </p>
              <p style="font-size:12px; color: var(--hint); margin-top:8px;">
                請私訊 kirariri studio 確認<br>
                IG：kirariri_studio
              </p>

              <button onclick="closeModal();resetForm();">
                  確定
              </button>
          `);

      })
      .catch(err => {

          showModal(`
              <p style="color:red;">
                  ${err.message}
              </p>

              <button onclick="closeModal()">
                  確定
              </button>
          `);

      })
      .finally(() => {
          hideLoading();
      });

  }

  function markError(el,isError){
      el.style.border = isError
          ? "2px solid #e74c3c"
          : "1px solid #ddd";
  }

  function resetForm(){
      nameEl.value = "";
      phoneEl.value = "";
      paycodeEl.value = "";
      membershipEl.value = "";

      document.getElementById("slotDisplay").textContent = "--";
  }

  function updateAmount(){

      let amount = 0;

      if(membershipEl.value === "少女會員"){
          amount = 3000;
      }

      if(membershipEl.value === "華族會員"){
          amount = 5000;
      }

      if(membershipEl.value === "公主會員"){
          amount = 8000;
      }

      document.getElementById("slotDisplay").textContent =
          "$" + amount.toLocaleString();
  }
  membershipEl.addEventListener("change",updateAmount);

</script>

</body>
</html>
